<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Personal Blog</h1>
        <p class="subtitle">Jot down your thoughts, one post at a time.</p>
    </header>
    
    <main>
        <!-- Form to add OR edit a post -->
        <section class="form-section" aria-labelledby="form-heading">
            <h2 id="form-heading">Create a New Post</h2>

            <form id="post-form" novalidate>
                <input type="hidden" id="editing-id" value="" />

                <div class="form-group">
                    <label for="post-title">Title</label>
                    <input 
                        type="text"
                        id="post-title"
                        name="title"
                        placeholder="Enter a title..."
                        required
                    />
                    <span class="error-message" id="title-error" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="post-content">Content</label>
                    <textarea 
                        type="text"
                        id="post-content"
                        name="content"
                        rows="5"
                        placeholder="Write your thoughts..."
                        required
                    ></textarea>
                    <span class="error-message" id="content-error" role="alert"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Add A Post</button>
                    <button type="button" id="cancel-btn" class="hidden">Cancel Edit</button>
                </div>
            </form>
        </section>

        <!-- Where posts will get rendered -->
         <section class="posts-section" aria-labelledby="posts-heading">
            <h2 id="posts-heading">Your Posts</h2>
            <div id="posts-container"></div>
            <p id="no-posts-message">No posts yet. Start Writing!</p>
         </section>
    </main>
</body>
</html>
